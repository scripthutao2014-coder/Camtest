<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cam & Audio Setup V2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #202124;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #2b2d31;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            font-weight: 500;
        }

        .video-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            aspect-ratio: 16/9;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Efek mirror dihapus biar teks dari OBS gak kebalik */
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .select-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 14px;
            color: #9aa0a6;
        }

        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #5f6368;
            background-color: #202124;
            color: white;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: #8ab4f8;
        }

        .status {
            text-align: center;
            font-size: 13px;
            color: #81c995;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Setelan Audio & Video</h2>
        
        <div class="video-container">
            <video id="videoPreview" autoplay playsinline muted></video>
        </div>

        <div class="controls">
            <div class="select-group">
                <label for="videoSource">Kamera (Video Input)</label>
                <select id="videoSource"></select>
            </div>

            <div class="select-group">
                <label for="audioSource">Mikrofon (Audio Input)</label>
                <select id="audioSource"></select>
            </div>
        </div>

        <div class="status" id="statusText">Meminta izin akses...</div>
    </div>

    <script>
        const videoElement = document.getElementById('videoPreview');
        const audioSelect = document.getElementById('audioSource');
        const videoSelect = document.getElementById('videoSource');
        const statusText = document.getElementById('statusText');

        let currentStream;

        // Fungsi utama untuk memaksa browser membaca semua device
        async function initDevices() {
            try {
                // 1. Paksa minta izin DULU sebelum nge-scan device
                currentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                
                // 2. Setelah izin dikasih, baru kita scan semua hardware yang nyolok
                await updateDeviceList();

                // 3. Pasang stream pertama kali ke layar
                videoElement.srcObject = currentStream;
                statusText.innerText = "Perangkat berhasil dimuat. Silakan pilih kamera.";
                statusText.style.color = "#81c995";

            } catch (error) {
                console.error("Error akses kamera:", error);
                statusText.innerText = "Error: Pastikan browser diizinkan mengakses kamera!";
                statusText.style.color = "#f28b82";
            }
        }

        // Fungsi untuk mengambil dan menyusun daftar kamera/mic ke dropdown
        async function updateDeviceList() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            
            // Simpan pilihan sebelumnya (kalau ada) biar gak keriset pas refresh
            const currentVideo = videoSelect.value;
            const currentAudio = audioSelect.value;

            audioSelect.innerHTML = '';
            videoSelect.innerHTML = '';

            devices.forEach(device => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                
                if (device.kind === 'audioinput') {
                    option.text = device.label || `Mikrofon Tersembunyi ${audioSelect.length + 1}`;
                    audioSelect.appendChild(option);
                } else if (device.kind === 'videoinput') {
                    option.text = device.label || `Kamera Tersembunyi ${videoSelect.length + 1}`;
                    videoSelect.appendChild(option);
                }
            });

            // Kembalikan ke pilihan sebelumnya jika masih tersedia
            if (currentVideo) videoSelect.value = currentVideo;
            if (currentAudio) audioSelect.value = currentAudio;
        }

        // Fungsi kalau lu ganti pilihan dari Dropdown
        async function switchDevice() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const audioSource = audioSelect.value;
            const videoSource = videoSelect.value;

            const constraints = {
                audio: { deviceId: audioSource ? { exact: audioSource } : undefined },
                video: { deviceId: videoSource ? { exact: videoSource } : undefined }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = currentStream;
            } catch (error) {
                console.error("Gagal ganti kamera:", error);
                statusText.innerText = "Kamera gagal dimuat (mungkin sedang dipakai aplikasi lain)";
                statusText.style.color = "#f28b82";
            }
        }

        audioSelect.onchange = switchDevice;
        videoSelect.onchange = switchDevice;

        // Kalau ada kamera/mic baru yang dicolok, otomatis update daftarnya
        navigator.mediaDevices.ondevicechange = updateDeviceList;

        // Jalankan script
        initDevices();
    </script>

</body>
</html>
